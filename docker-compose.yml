services:
  ask-runbook:
    build: .
    image: ask-runbook:1.0
    ports:
      - "8000:8000"
    environment:
      # Pass the key in from your shell / .env - do NOT hard-code it here.
      - GROQ_API_KEY=${GROQ_API_KEY}
    healthcheck:
      # Docker restarts / marks unhealthy based on /health (no model call, so it's cheap).
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
